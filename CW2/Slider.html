
<html>
<head>

    <title>

    </title>
    <link rel="stylesheet" type="text/css" href="Style_01.css">
</head>


<body>


<div class="slideshow-container">

    <!-- Full-width images with number and caption text -->
    <div class="mySlides fade">
     
      <img src="Jump_rope_250x200.jpg" style="width:100%">
      <div class="text">Jump Rope</div>
    </div>
  
    <div class="mySlides fade">
 
      <img src="longtenis 250x200.jpg" style="width:100%">
      <div class="text">Long Tennis</div>
    </div>
  
    <div class="mySlides fade">
      
      <img src="monopoly 250x200.jpg" style="width:100%">
      <div class="text">Monopoly</div>
    </div>
  
    <!-- Next and previous buttons -->
    <a class="prev" onclick="plus_Slides(-1)">&#10094;</a>
    <a class="next" onclick="plus_Slides(1)">&#10095;</a>
  </div>
  <br>
  
  <!-- The dots/circles -->
  <div style="text-align:center">
    <span class="dot" onclick="current_Slide(1)"></span>
    <span class="dot" onclick="current_Slide(2)"></span>
    <span class="dot" onclick="current_Slide(3)"></span>
  </div>

  
        

  <script src="script1.js"></script>
  </body>
